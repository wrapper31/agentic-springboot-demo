name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start MongoDB, Kafka and LocalStack with Testcontainers (Docker is preinstalled on the runner).
      # Also enforces the JaCoCo coverage gate configured in pom.xml.
      - name: Build and test order-service
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            { echo "### Coverage"; echo; python3 scripts/coverage-summary.py; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and test codebase MCP server
        run: mvn -B -f tools/codebase-mcp/pom.xml verify
